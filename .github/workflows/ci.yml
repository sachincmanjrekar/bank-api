name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # same as the local .venv

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -v

      - name: Check migrations
        env:
          DATABASE_URL: sqlite:///./ci.db  # fresh, empty database just for this check
        run: |
          alembic upgrade head    # every migration applies cleanly from scratch
          alembic check           # fails if models.py changed without a new migration
          alembic downgrade base  # and every migration can be undone
